name: CI

# Los commits diarios de commitling.yml solo tocan los SVG de la mascota:
# no hace falta revisar nada en ese caso.
on:
  push:
    branches: [main]
    paths-ignore: ["commitling.svg", "commitling-dark.svg"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (binario oficial con suma de comprobación)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Historial completo y árbol de trabajo
        run: |
          ./gitleaks git . --redact --no-banner -v
          ./gitleaks dir . --redact --no-banner -v

  perfil:
    name: README y web estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: El README sigue mostrando la mascota commitling
        run: |
          grep -qF 'srcset="./commitling-dark.svg"' README.md || { echo "::error::Falta commitling-dark.svg en el README"; exit 1; }
          grep -qF 'src="./commitling.svg"' README.md || { echo "::error::Falta commitling.svg en el README"; exit 1; }
      - name: Las imágenes locales del README existen
        run: |
          fallo=0
          for ruta in $(grep -ohE '(src|srcset)="\./[^"]+"' README.md | sed -E 's/^[a-z]+="\.\///; s/"$//' | sort -u); do
            [ -e "$ruta" ] || { echo "::error::No existe: $ruta"; fallo=1; }
          done
          exit $fallo
      - name: Web sin estilos ni scripts en línea, sin innerHTML, con CSP
        run: |
          # Las páginas del portafolio: español (site/) e inglés (site/en/). El JSON-LD es un bloque de datos, no un script.
          if grep -nE 'style=|<style|<script>|on(click|load|error|change)=' site/*.html site/en/*.html; then echo "::error::Estilos/scripts en línea: rompen la CSP"; exit 1; fi
          if grep -nE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write' site/*.js; then echo "::error::Usa textContent"; exit 1; fi
          for f in site/index.html site/en/index.html; do
            grep -q 'Content-Security-Policy' "$f" || { echo "::error::Falta la CSP en $f"; exit 1; }
          done
      - name: La web no publica ningún email ni el teléfono
        run: |
          # Todo site/ menos los PDF del CV (site/cv/*.pdf), que sí llevan el contacto completo a propósito.
          if find site -type f ! -path 'site/cv/*.pdf' -print0 | xargs -0 grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}'; then echo "::error::Email en la web"; exit 1; fi
          telefono=$(node -p "require('./perfil.json').contacto.telefono.replace(/\D/g, '').slice(-9).split('').join('[ .-]?')")
          if find site -type f ! -path 'site/cv/*.pdf' -print0 | xargs -0 grep -nIE "$telefono"; then echo "::error::Teléfono en la web"; exit 1; fi
      - name: Los archivos enlazados de la web existen
        run: |
          fallo=0
          # Cada ruta se resuelve desde la carpeta de su página (site/en/ enlaza con «../»).
          for pagina in site/*.html site/en/*.html; do
            carpeta=$(dirname "$pagina")
            for ruta in $(grep -ohE '(src|href|srcset)="[^"#:]+"' "$pagina" | sed -E 's/^[a-z]+="//; s/"$//' | sort -u); do
              [ -e "$carpeta/$ruta" ] || { echo "::error::No existe: $carpeta/$ruta (enlazado desde $pagina)"; fallo=1; }
            done
          done
          for ruta in site/sitemap.xml site/robots.txt; do
            [ -f "$ruta" ] || { echo "::error::Falta $ruta"; fallo=1; }
          done
          exit $fallo
      - name: Las tarjetas coinciden con proyectos.json
        run: node scripts/generar-tarjetas.mjs --comprobar
      - name: Pruebas de los scripts
        run: node --test scripts/vigilar-csp.test.mjs
      - name: La web tiene og:image, Trusted Types e idiomas alternos
        run: |
          [ -f site/og.png ] || { echo "::error::Falta site/og.png"; exit 1; }
          for f in site/index.html site/en/index.html; do
            grep -q '<meta property="og:image" content="https://bertmarti.github.io/BertMarti/og.png">' "$f" || { echo "::error::Falta og:image absoluta en $f"; exit 1; }
            grep -q "require-trusted-types-for 'script'" "$f" || { echo "::error::Falta Trusted Types en la CSP de $f"; exit 1; }
            grep -q '<link rel="alternate" hreflang="en" href="https://bertmarti.github.io/BertMarti/en/">' "$f" || { echo "::error::Falta el hreflang en $f"; exit 1; }
          done
      - name: JavaScript y SVG válidos
        run: |
          for f in site/*.js scripts/*.mjs; do node --check "$f"; done
          for f in img/*.svg site/*.svg site/sitemap.xml; do python3 -c "import sys,xml.etree.ElementTree as E; E.parse(sys.argv[1])" "$f"; done
