  <text class="sans" x="68" y="378" fill="#1c1826" font-size="124" font-weight="800" letter-spacing="-4.3">Martínez</text>
  <rect x="602" y="357" width="21" height="21" fill="#6d28d9"/>
  <text class="sans" x="72" y="456" fill="#1c1826" font-size="38" font-weight="750">Full-Stack Developer</text>
  <text class="mono" x="72" y="506" fill="#595366" font-size="21" font-weight="500">Java · Spring Boot · React · Angular · IA</text>
  <text class="mono" x="72" y="566" fill="#595366" font-size="20" font-weight="500">NTT DATA · Jaén, España</text>

  <g transform="translate(786 62)">
