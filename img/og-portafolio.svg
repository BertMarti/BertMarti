<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fuente de site/og.png (imagen al compartir el portafolio). Se renderiza con Chromium: ver AGENTS.md. -->
  <defs>
    <clipPath id="tarjeta"><rect width="320" height="200" rx="14"/></clipPath>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#312e81" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <path d="M0 520C190 472 286 554 460 498s270-41 404-7 229-17 336-72v211H0Z" fill="#ede9fe"/>
  <path d="M0 566c170-35 273 14 431-22 170-39 254 13 395-9 159-25 232 5 374-41v136H0Z" fill="#cffafe" opacity=".7"/>

  <g fill="#14b8a6"><rect x="72" y="58" width="14" height="14"/><rect x="90" y="76" width="8" height="8"/></g>
  <text x="72" y="148" fill="#0f766e" font-family="'Noto Sans Mono',ui-monospace,monospace" font-size="22" font-weight="700" letter-spacing="3">FULL-STACK · PRODUCTO · IA</text>
  <text x="68" y="236" fill="#1e1b2e" font-family="'Nunito Sans',system-ui,sans-serif" font-size="84" font-weight="900" letter-spacing="-2">Alberto</text>
  <text x="68" y="318" fill="#1e1b2e" font-family="'Nunito Sans',system-ui,sans-serif" font-size="84" font-weight="900" letter-spacing="-2">Martínez</text>
  <rect x="74" y="344" width="84" height="8" rx="4" fill="#7c3aed"/>
  <text x="72" y="398" fill="#6d28d9" font-family="'Nunito Sans',system-ui,sans-serif" font-size="30" font-weight="800">Senior Full-Stack Developer</text>
  <text x="72" y="438" fill="#334155" font-family="'Nunito Sans',system-ui,sans-serif" font-size="26" font-weight="600">Frontend + Backend + IA · proyectos abiertos</text>
  <g font-family="'Noto Sans Mono',ui-monospace,monospace" font-size="21" font-weight="700">
    <rect x="72" y="478" width="420" height="50" rx="25" fill="#7c3aed"/>
    <text x="282" y="510" fill="#ffffff" text-anchor="middle">bertmarti.github.io/BertMarti</text>
  </g>

  <g transform="translate(720 62) rotate(-4)" filter="url(#sombra)">
