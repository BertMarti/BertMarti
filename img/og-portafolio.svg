  <g transform="translate(640 300) rotate(-2)" filter="url(#sombra)">
    <g clip-path="url(#tarjeta)"><image href="../site/img/proyectos/roscodex.webp" width="320" height="200" preserveAspectRatio="xMidYMid slice"/></g>
