<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fuente de site/og.png (imagen al compartir el portafolio). Se renderiza con Chrome/Chromium: ver AGENTS.md.
       Misma identidad que la web: papel y tinta, violeta de marca, turquesa y el píxel como firma.
       Las fuentes se cargan de site/fonts/: al renderizar hay que pasar allow-file-access-from-files. -->
  <defs>
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("../site/fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "JetBrains Mono"; src: url("../site/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
      .sans { font-family: "Schibsted Grotesk", "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    </style>
    <clipPath id="escalon"><path d="M0 28h14V14h14V0h244v14h14v14h14v244h-14v14h-14v14H28v-14H14v-14H0z"/></clipPath>
    <clipPath id="captura"><rect width="160" height="100" rx="8"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#f6f2ea"/>

  <g transform="translate(72 64) scale(5)" shape-rendering="crispEdges">
